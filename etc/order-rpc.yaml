Name: order.rpc
ListenOn: 127.0.0.1:18005
Mode: dev
Timeout: 800
Etcd:
  Hosts: [127.0.0.1:2379]
  Key: service-rpc/order.v1
MySQL:
  # 生产账号只授予 orders/order_items；示例仍复用本地开发实例。
  DataSource: service_rpc:service_rpc@tcp(127.0.0.1:3307)/service_rpc?charset=utf8mb4&parseTime=true&loc=UTC
  MaxOpenConns: 16
  MaxIdleConns: 8
  ConnMaxLifetimeSeconds: 300
ProductRPC:
  Timeout: 300
  Etcd:
    Hosts: [127.0.0.1:2379]
    Key: service-rpc/product.v1
