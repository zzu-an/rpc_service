Name: store-api
Host: 127.0.0.1
Port: 8888
Mode: dev
MySQL:
  DataSource: service_rpc:service_rpc@tcp(192.168.0.107:3307)/service_rpc?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
  MaxOpenConns: 10
  MaxIdleConns: 5
  ConnMaxLifetimeSeconds: 300
Auth:
  AccessSecret: local-development-secret-change-me-2026
  AccessTTLSeconds: 900
Redis:
  Address: 192.168.0.107:6379
  Username: ""
  Password: redis_030603
  DB: 0
  DialTimeoutMilliseconds: 500
  OperationTimeoutMilliseconds: 200
RedisStream:
  ConsumerGroup: service-rpc-seckill-stream-v1
  ConsumerPrefix: stream-worker
  # 全局 MySQL Purchase 并发上限，必须小于 MySQL MaxOpenConns 并给其他 SQL 留预算。
  ConsumerConcurrency: 4
  BatchSize: 10
  BlockMilliseconds: 100
  ClaimIdleMilliseconds: 1000
  DiscoveryIntervalMilliseconds: 1000
  ShutdownTimeoutMilliseconds: 10000
  MaxDeliveries: 3
  # Stream/results 比准入 state 多保留一天，允许活动结束后继续排空。
  RetentionSeconds: 86400
Seckill:
  # 可选 atomic / pessimistic / optimistic；修改后必须重启服务。
  StockMode: atomic
  # 可选 mysql / redis；Redis 故障时不会自动回退 MySQL。
  AdmissionMode: redis
  # 可选 sync / async-stream；Kafka 版本请切换 codex/v0.4.1-kafka 分支。
  OrderMode: async-stream

