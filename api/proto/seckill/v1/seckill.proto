syntax = "proto3";

package seckill.v1;

option go_package = "service_rpc/api/gen/seckill/v1;seckillv1";

service SeckillService {
  rpc CreateActivity(CreateActivityRequest) returns (CreateActivityResponse);
  rpc UpdateActivityStatus(UpdateActivityStatusRequest) returns (UpdateActivityStatusResponse);
  rpc PreheatActivity(PreheatActivityRequest) returns (PreheatActivityResponse);
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  rpc GetResult(GetResultRequest) returns (GetResultResponse);
  // orchestrator 通过服务边界发现需要消费的内部 Stream，禁止回退 MySQL 或 Redis SCAN。
  rpc ListStreamItemIDs(ListStreamItemIDsRequest) returns (ListStreamItemIDsResponse);
}

enum ActivityStatus {
  ACTIVITY_STATUS_UNSPECIFIED = 0;
  ACTIVITY_STATUS_ENABLED = 1;
  ACTIVITY_STATUS_DISABLED = 2;
}

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_STATUS_QUEUED = 1;
  RESULT_STATUS_SUCCEEDED = 2;
  RESULT_STATUS_FAILED = 3;
}

message Activity {
  uint64 id = 1;
  string name = 2;
  int64 start_at_ms = 3;
  int64 end_at_ms = 4;
  ActivityStatus status = 5;
  int64 created_at_ms = 6;
}

message CreateActivityRequest {
  string name = 1;
  int64 start_at_ms = 2;
  int64 end_at_ms = 3;
}

message CreateActivityResponse {
  Activity activity = 1;
}

message UpdateActivityStatusRequest {
  uint64 activity_id = 1;
  ActivityStatus status = 2;
}

message UpdateActivityStatusResponse {}

message PreheatActivityRequest {
  uint64 activity_id = 1;
}

message PreheatActivityResponse {
  uint64 activity_id = 1;
  uint32 item_count = 2;
  int64 earliest_expire_at_ms = 3;
  int64 latest_expire_at_ms = 4;
}

message EnqueueRequest {
  uint64 user_id = 1;
  uint64 item_id = 2;
}

message EnqueueResponse {
  // HTTP 202 只表示 Redis Lua 已原子扣资格并写入 Stream，不表示 MySQL 订单已经创建。
  string order_no = 1;
  ResultStatus status = 2;
  bool replayed = 3;
}

message GetResultRequest {
  uint64 user_id = 1;
  string order_no = 2;
}

message GetResultResponse {
  string order_no = 1;
  ResultStatus status = 2;
  uint64 order_id = 3;
}

message ListStreamItemIDsRequest {}

message ListStreamItemIDsResponse {
  repeated uint64 item_ids = 1;
}
